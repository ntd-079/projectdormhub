<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CE 04 - Smart Sorting Dashboard</title>
    <!-- นำเข้า Tailwind CSS สำหรับตกแต่งหน้าตาให้สวยงาม -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- นำเข้า Chart.js สำหรับวาดกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 🎯 นำเข้าปลั๊กอินสำหรับแสดงตัวเลขบนหัวแท่งกราฟ (DataLabels) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <!-- นำเข้า Socket.io Client (ชี้มาที่ Server Node.js ของเรา) -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.1/dist/socket.io.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

    <!-- Header ด้านบน -->
    <header class="bg-slate-800 border-b border-slate-700 p-5 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-teal-400">📦Smart Sorting System</h1>
            <div class="flex items-center gap-2">
                <span id="status-dot" class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
                <span id="status-text" class="text-sm text-slate-400">กำลังเชื่อมต่อ Server...</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-6 space-y-6">
        
        <!-- ส่วนที่ 1: การ์ดตัวเลขสรุปสถิติรวม (Counter Cards) -->
        <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-sm font-medium">พัสดุผ่านสายพานทั้งหมด</p>
                <p id="total-count" class="text-4xl font-bold text-teal-400 mt-2">0</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-sm font-medium">คัดแยกสำเร็จ (Sorted)</p>
                <p id="sorted-count" class="text-4xl font-bold text-emerald-400 mt-2">0</p>
            </div>
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow">
                <p class="text-slate-400 text-sm font-medium">ตกหล่น/ผิดพลาด (Rejected)</p>
                <p id="rejected-count" class="text-4xl font-bold text-rose-500 mt-2">0</p>
            </div>
        </section>

        <!-- ส่วนที่ 2: แสดงข้อมูลพัสดุชิ้นล่าสุด และ กราฟสถิติภูมิภาค -->
        <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <!-- กล่องแสดงพัสดุล่าสุด (Live Feed) -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 flex flex-col justify-between">
                <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-teal-400"></span> พัสดุชิ้นล่าสุดบนสายพาน
                </h2>
                <div class="bg-slate-900/50 p-6 rounded-lg border border-slate-800 text-center py-10 my-auto">
                    <p class="text-xs text-slate-500 uppercase tracking-wider">Barcode Data</p>
                    <p id="live-barcode" class="text-3xl font-mono font-bold text-slate-300 mt-1">-</p>
                    
                    <div class="grid grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-800">
                        <div>
                            <p class="text-xs text-slate-500">เป้าหมายประตู</p>
                            <p id="live-gate" class="text-xl font-semibold text-teal-400 mt-1">-</p>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500">สถานะ</p>
                            <p id="live-status" class="text-xl font-semibold text-slate-400 mt-1">-</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- กล่องแสดงกราฟ (Chart.js) -->
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                <h2 class="text-lg font-semibold text-slate-200 mb-4">📊 สถิติการคัดแยกรายประตู</h2>
                <div class="h-64 flex items-center justify-center">
                    <canvas id="regionChart"></canvas>
                </div>
            </div>

        </section>
    </main>

    <!-- ========================================== -->
    <!-- ส่วนของ JavaScript และการเชื่อมต่อ Socket.io -->
    <!-- ========================================== -->
    <script>
        // 1. 🎯 เชื่อมต่อกับ Server Node.js
        const socket = io("http://127.0.0.1:3000"); 

        // 2. ดักฟังสถานะการเชื่อมต่อกับ Server
        socket.on("connect", () => {
            document.getElementById("status-dot").className = "w-3 h-3 rounded-full bg-emerald-500";
            document.getElementById("status-text").innerText = "เชื่อมต่อระบบเรียลไทม์แล้ว";
            document.getElementById("status-text").className = "text-sm text-emerald-400";
        });

        socket.on("disconnect", () => {
            document.getElementById("status-dot").className = "w-3 h-3 rounded-full bg-red-500 animate-pulse";
            document.getElementById("status-text").innerText = "ขาดการเชื่อมต่อ...";
            document.getElementById("status-text").className = "text-sm text-rose-500";
        });

        // 3. 📊 ตั้งค่าเริ่มต้นให้กับกราฟแท่ง (แก้ไข: เพิ่มชื่อภาคใต้ Gate และเปิดใช้งานปลั๊กอิน DataLabels)
        const ctx = document.getElementById('regionChart').getContext('2d');
        const regionChart = new Chart(ctx, {
            type: 'bar',
            plugins: [ChartDataLabels], // 👈 ลงทะเบียนใช้งานปลั๊กอินตัวเลขบนหัวกราฟ
            data: {
                // ส่งค่าเป็น Array ซ้อนกันเพื่อขึ้นบรรทัดใหม่ให้กับข้อความบอกชื่อภาค
                labels: [
                    ['Gate 1', 'ภาคเหนือ'], 
                    ['Gate 2', 'ภาคกลาง'], 
                    ['Gate 3', 'ภาคอีสาน'], 
                    ['Gate 4', 'ภาคใต้'], 
                    ['Reject', '(Gate 0)']
                ],
                datasets: [{
                    label: 'จำนวนพัสดุ (ชิ้น)',
                    data: [0, 0, 0, 0, 0], 
                    backgroundColor: ['#2dd4bf', '#38bdf8', '#fbbf24', '#a78bfa', '#f43f5e'],
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { 
                    legend: { display: false },
                    // 🎯 ปรับแต่งหน้าตาตัวเลขที่จะแสดงบนหัวแท่งกราฟ
                    datalabels: {
                        anchor: 'end',        // ยึดตำแหน่งไว้ที่ส่วนท้ายของแท่งกราฟ
                        align: 'top',         // แสดงตัวเลขเหนือบาร์ขึ้นไปด้านบน
                        color: '#f8fafc',     // สีฟอนต์ตัวเลข (ขาวนวล)
                        font: {
                            weight: 'bold',
                            size: 13
                        },
                        formatter: function(value) {
                            return value;     // พิมพ์ค่าตัวเลขดิบออกมาตรงๆ
                        }
                    }
                },
                scales: {
                    y: { 
                        beginAtZero: true, 
                        grid: { color: '#334155' }, 
                        ticks: { color: '#94a3b8' },
                        grace: '12%'          // เผื่อพื้นที่ว่างด้านบนของกราฟเล็กน้อยเพื่อไม่ให้ตัวเลขหัวบาร์หลุดขอบ
                    },
                    x: { 
                        ticks: { 
                            color: '#94a3b8',
                            font: { size: 12 }
                        }, 
                        grid: { display: false } 
                    }
                }
            }
        });

        // 🔄 ฟังก์ชันส่วนกลางสำหรับประมวลผลและอัปเดต UI หน้าจอ
        function updateDashboardUI(data) {
            console.log("Data received from server:", data);

            // อัปเดตการ์ดตัวเลขสรุปสถิติตัวเลขรวมประจำวัน
            document.getElementById("total-count").innerText = data.total_today ?? 0;
            document.getElementById("sorted-count").innerText = data.sorted_today ?? 0;
            document.getElementById("rejected-count").innerText = data.rejected_today ?? 0;

            // 🎯 ปลดล็อกตัวกรองเพื่อให้พัสดุชิ้นล่าสุดแสดงผลทุกกรณีเหมือนเดิม
            if (data.latest_parcel) {
                const parcel = data.latest_parcel;
                
                document.getElementById("live-barcode").innerText = parcel.barcode_data;
                document.getElementById("live-gate").innerText = parcel.gate_assigned === 0 
                    ? "Reject Gate" 
                    : `Gate ${parcel.gate_assigned} (${parcel.region || 'ไม่ระบุภูมิภาค'})`;
                
                const statusEl = document.getElementById("live-status");
                statusEl.innerText = parcel.status;
                statusEl.className = `text-xl font-semibold ${parcel.status === 'Sorted' ? 'text-emerald-400' : 'text-rose-500'}`;
            }

            // จัดสรรสถิติเพื่อนำมาขยับแท่งกราฟแบบไดนามิก (ดึงข้อมูลของ Gate 0 มารวมด้วย)
            let g0 = 0, g1 = 0, g2 = 0, g3 = 0, g4 = 0;
            if (data.gate_stats) {
                data.gate_stats.forEach(item => {
                    if (item.gate_assigned === 0) g0 = item.count;
                    if (item.gate_assigned === 1) g1 = item.count;
                    if (item.gate_assigned === 2) g2 = item.count;
                    if (item.gate_assigned === 3) g3 = item.count;
                    if (item.gate_assigned === 4) g4 = item.count;
                });
            }

            // 🎯 เรียงให้ Gate 0 อยู่หลังสุดในมิติของแท่งกราฟ [g1, g2, g3, g4, g0]
            regionChart.data.datasets[0].data = [g1, g2, g3, g4, g0];
            regionChart.update();
        }

        // 4. ⚡ รับข้อมูลสรุปรอบแรกสุดจาก MySQL
        socket.on("init-dashboard", (data) => {
            updateDashboardUI(data);
        });

        // 5. ⚡ รอรับข้อมูลเหตุการณ์ 'new-parcel' เมื่อมีการสแกนกล่องใหม่
        socket.on("new-parcel", (data) => {
            updateDashboardUI(data);
        });
    </script>
</body>
</html>
